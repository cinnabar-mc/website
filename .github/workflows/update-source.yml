name: Update client inputs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-client-inputs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check for an existing input update
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/client-inputs-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Check upstream inputs
        if: steps.pending.outputs.count == '0'
        id: source
        run: |
          python3 source.py update
          if ! git diff --quiet -- source.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated inputs
        if: steps.source.outputs.changed == 'true'
        run: |
          python3 render.py
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Propose the updated pin
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 propose_source.py

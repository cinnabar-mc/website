name: Website

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.151.0'
  WEBSITE_URL: 'https://cinnabar.cinnabar-api.workers.dev'

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test website and deployment boundary
        run: |
          python3 source.py fetch
          python3 render.py
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate the Cloudflare configuration
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: dist/

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: website
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: dist
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy
      - name: Check every published file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            curl --fail --location --retry 3 "$WEBSITE_URL/${file#dist/}?release=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/served"
            cmp "$file" "$RUNNER_TEMP/served"
          done < <(find dist -type f -print0)
